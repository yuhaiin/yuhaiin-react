name: Enterprise reliability UI

on:
  pull_request:
    paths:
      - 'src/component/selector-*.tsx'
      - 'src/docs/group/selectors/**'
      - 'src/api/monitoring.ts'
      - 'src/api/generated*.ts'
      - 'src/i18n/resources/*/routing.json'
      - '.github/workflows/reliability.yml'

concurrency:
  group: reliability-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitoring-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '23'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run style:audit
      - run: npm test -- --maxWorkers=2
      - run: npm run build
