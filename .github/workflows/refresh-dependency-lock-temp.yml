name: Refresh dependency lockfile (temporary)
on:
  pull_request:
    branches: [main]
    paths: [package.json, .github/workflows/refresh-dependency-lock-temp.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.head_ref == 'chore/replay-dependencies-pr452-20261011' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '23'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --force
      - name: Commit refreshed package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(deps): regenerate package-lock for updated dependencies"
          git push origin HEAD:${{ github.head_ref }}
