# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm install --force

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm run test

      - name: Translations
        run: npm run i18n:check

      - name: Style audit
        run: npm run style:audit

      - name: Lint
        run: npm run lint

      - run: npm run build
        env:
          CI: false

      - name: Capture updated desktop and mobile UX snapshots
        run: |
          set -euo pipefail
          npm run dev:msw > /tmp/msw-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5175/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-ux.mjs || { cat /tmp/msw-preview.log; exit 1; }

      - name: Show UX screenshots in job summary
        run: |
          set -euo pipefail
          shots=(routing-desktop rule-editor nodes-desktop selectors-desktop routing-mobile rule-editor-mobile nodes-mobile node-details-mobile selectors-mobile selector-details-mobile inbounds-desktop inbounds-mobile lists-desktop lists-mobile publishes-desktop publishes-mobile resolvers-desktop resolvers-mobile)
          for name in "${shots[@]}"; do
            # The current run verifies rendering. Images in this summary are
            # the committed visual reference, not runner-local PNG files.
            test -s "/tmp/ux-shots/${name}.png"
            test -s "docs/ux-refactor/${name}.png"
          done

          images="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ github.event.pull_request.head.sha || github.sha }}/docs/ux-refactor"
          {
            echo '## Routing and Nodes UX previews'
            echo
            echo 'The current CI run captured 18 desktop and mobile states and checked their layout. The inline images below are the screenshots committed to this revision, not the transient runner PNGs. If the layout changes, refresh the committed images as part of the PR.'
            echo
            echo '### Routing'
            echo
            echo '| Desktop | Mobile |'
            echo '| :---: | :---: |'
            echo "| ![Routing desktop](${images}/routing-desktop.png) | ![Routing mobile](${images}/routing-mobile.png) |"
            echo
            echo '### Rule editor'
            echo
            echo '| Advanced editor | Mobile editor |'
            echo '| :---: | :---: |'
            echo "| ![Advanced rule editor](${images}/rule-editor.png) | ![Mobile rule editor](${images}/rule-editor-mobile.png) |"
            echo
            echo '### Nodes'
            echo
            echo '| Desktop | Mobile directory | Mobile details |'
            echo '| :---: | :---: | :---: |'
            echo "| ![Nodes desktop](${images}/nodes-desktop.png) | ![Nodes mobile](${images}/nodes-mobile.png) | ![Node details mobile](${images}/node-details-mobile.png) |"
            echo ""
            echo "### Shared destinations"
            echo ""
            echo "| Desktop | Mobile directory | Mobile editor |"
            echo "| --- | --- | --- |"
            echo "| ![Shared destinations](${images}/selectors-desktop.png) | ![Shared destinations mobile](${images}/selectors-mobile.png) | ![Shared destination editor](${images}/selector-details-mobile.png) |"
            echo ""
            echo "### Traffic entry"
            echo ""
            echo "| Desktop | Mobile directory |"
            echo "| --- | --- |"
            echo "| ![Traffic entry desktop](${images}/inbounds-desktop.png) | ![Traffic entry mobile](${images}/inbounds-mobile.png) |"
            echo ""
            echo "### Shared matching data"
            echo ""
            echo "| Desktop | Mobile directory |"
            echo "| --- | --- |"
            echo "| ![Shared matching data desktop](${images}/lists-desktop.png) | ![Shared matching data mobile](${images}/lists-mobile.png) |"
            echo ""
            echo "### Node publishing"
            echo ""
            echo "| Desktop | Mobile directory |"
            echo "| --- | --- |"
            echo "| ![Node publishing desktop](${images}/publishes-desktop.png) | ![Node publishing mobile](${images}/publishes-mobile.png) |"
            echo ""
            echo "### DNS resolvers"
            echo ""
            echo "| Desktop | Mobile directory |"
            echo "| --- | --- |"
            echo "| ![DNS resolvers desktop](${images}/resolvers-desktop.png) | ![DNS resolvers mobile](${images}/resolvers-mobile.png) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - run: |
          cat <<EOF > dist/go.mod
          module github.com/yuhaiin/yuhaiin.github.io

          go 1.22.0
          EOF
          
      - run: |
          cat <<EOF > dist/yuhaiin.go
          package yuhaiin_github_io

          import "embed"

          //go:embed index.html assets docs
          var Content embed.FS
          EOF

      - run: |
          git clone https://github.com/yuhaiin/yuhaiin.github.io.git publish
          rm -rf publish/.git
          rm -rf publish/_next
          rm -rf publish/_not-found
          rm -rf publish/404
          rm -rf publish/404.html
          rm -rf publish/index.txt
          rm -rf publish/__next.__PAGE__.txt
          rm -rf publish/__next._full.txt
          rm -rf publish/__next._index.txt
          rm -rf publish/__next._tree.txt
          rm -rf publish/assets
          rm -rf publish/docs
          rm -rf publish/index.html
          cp -rf dist/* publish/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request'
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./publish
          external_repository: yuhaiin/yuhaiin.github.io
          publish_branch: main # default: gh-pages
          enable_jekyll: false

      - name: upload_static
        uses: actions/upload-artifact@v7
        with:
          name: statics
          path: |
            dist
