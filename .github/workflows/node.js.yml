# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

# v2 branch: publishes the Web UI to the yuhaiin.github.io "v2" branch, which only
# the core's v2 builds embed. The public site and stable cores keep using "main".
on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]

# Only cancel runs of the identical commit. Rerunning an old v2 SHA must not
# cancel a newer build before it publishes. The publication checks reject
# stale commits independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The rolling OTA release is updated with the workflow token; the Pages
    # deploy below uses PERSONAL_TOKEN for the other repository.
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [23.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm install --force

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm run test

      - name: Translations
        run: npm run i18n:check

      - name: Style audit
        run: npm run style:audit

      - name: Lint
        run: npm run lint

      - run: npm run build
        env:
          CI: false

      - name: Stamp versioned frontend metadata
        run: node scripts/ui-ota.mjs prepare

      - name: Verify deterministic build metadata
        run: |
          cp dist/ui-build.json /tmp/ui-build-before.json
          node scripts/ui-ota.mjs prepare
          cmp /tmp/ui-build-before.json dist/ui-build.json

      - run: |
          cat <<EOF > dist/go.mod
          module github.com/yuhaiin/yuhaiin.github.io

          go 1.22.0
          EOF
          
      - run: |
          cat <<EOF > dist/yuhaiin.go
          package yuhaiin_github_io

          import "embed"

          //go:embed index.html assets docs ui-build.json
          var Content embed.FS
          EOF

      - run: |
          git clone https://github.com/yuhaiin/yuhaiin.github.io.git publish
          rm -rf publish/.git
          rm -rf publish/_next
          rm -rf publish/_not-found
          rm -rf publish/404
          rm -rf publish/404.html
          rm -rf publish/index.txt
          rm -rf publish/__next.__PAGE__.txt
          rm -rf publish/__next._full.txt
          rm -rf publish/__next._index.txt
          rm -rf publish/__next._tree.txt
          rm -rf publish/assets
          rm -rf publish/docs
          rm -rf publish/index.html
          # The OTA archive and feed are release assets (below), not Pages files.
          rm -f publish/frontend.tar.gz publish/ui-update.json
          cp -rf dist/* publish/

      - name: Package frontend OTA release
        run: |
          tar -czf frontend.tar.gz -C dist .
          node scripts/ui-ota.mjs release

      - name: Confirm latest v2 before publishing
        id: publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        run: |
          current="$(git ls-remote origin refs/heads/v2 | cut -f1)"
          if [[ -z "$current" ]]; then
            echo "::error::Unable to verify current v2; refusing to publish"
            exit 1
          fi
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not publishing an old workflow rerun: v2 is $current, build is $GITHUB_SHA"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: steps.publication.outputs.eligible == 'true'
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./publish
          external_repository: yuhaiin/yuhaiin.github.io
          publish_branch: v2 # never main from this branch
          enable_jekyll: false

      # The Core of v2 builds reads ui-v2/ui-update.json and ui-v2/frontend.tar.gz.
      # Assets are replaced in place, so the archive goes first: a client that
      # sees the old feed keeps its old archive hash, and one that sees the new
      # feed with the old archive fails its size/SHA-256 check and retries later.
      # A build is skipped unless it is newer than the published feed, which also
      # covers two builds racing past the check above.
      - name: Publish frontend OTA release assets
        if: steps.publication.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ui-v2
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Web UI v2 (rolling OTA channel)" \
              --notes "Rolling prerelease read by v2 Cores for Web UI updates. Assets are replaced by CI on every v2 build; do not edit them."
          fi
          mkdir -p ota
          gh release download "$TAG" --pattern ui-update.json --dir ota --clobber || true
          if node scripts/ui-ota.mjs newer ota/ui-update.json; then
            cp frontend-update.json ota/next-ui-update.json
            gh release upload "$TAG" frontend.tar.gz --clobber
            cp ota/next-ui-update.json ota/ui-update.json
            gh release upload "$TAG" ota/ui-update.json --clobber
          fi

      - name: upload_static
        uses: actions/upload-artifact@v7
        with:
          name: statics
          path: |
            dist
            frontend.tar.gz
            frontend-update.json
