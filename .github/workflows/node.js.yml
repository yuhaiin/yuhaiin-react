# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded workflow runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm install --force

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm run test

      - name: Translations
        run: npm run i18n:check

      - name: Style audit
        run: npm run style:audit

      - name: Lint
        run: npm run lint

      - run: npm run build
        env:
          CI: false

      - name: Stamp versioned frontend metadata
        run: node scripts/ui-ota.mjs prepare

      - name: Verify deterministic build metadata
        run: |
          cp dist/ui-build.json /tmp/ui-build-before.json
          node scripts/ui-ota.mjs prepare
          cmp /tmp/ui-build-before.json dist/ui-build.json

      - run: |
          cat <<EOF > dist/go.mod
          module github.com/yuhaiin/yuhaiin.github.io

          go 1.22.0
          EOF
          
      - run: |
          cat <<EOF > dist/yuhaiin.go
          package yuhaiin_github_io

          import "embed"

          //go:embed index.html assets docs ui-build.json
          var Content embed.FS
          EOF

      - run: |
          git clone https://github.com/yuhaiin/yuhaiin.github.io.git publish
          rm -rf publish/.git
          rm -rf publish/_next
          rm -rf publish/_not-found
          rm -rf publish/404
          rm -rf publish/404.html
          rm -rf publish/index.txt
          rm -rf publish/__next.__PAGE__.txt
          rm -rf publish/__next._full.txt
          rm -rf publish/__next._index.txt
          rm -rf publish/__next._tree.txt
          rm -rf publish/assets
          rm -rf publish/docs
          rm -rf publish/index.html
          rm -f publish/frontend.tar.gz publish/ui-update.json
          cp -rf dist/* publish/

      - name: Package frontend OTA release
        run: |
          tar -czf frontend.tar.gz -C dist .
          node scripts/ui-ota.mjs release
          cp frontend.tar.gz publish/frontend.tar.gz
          cp frontend-update.json publish/ui-update.json

      - name: Confirm latest main before publishing
        id: publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$current" ]]; then
            echo "::error::Unable to verify current main; refusing to publish"
            exit 1
          fi
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not publishing an old workflow rerun: main is $current, build is $GITHUB_SHA"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: steps.publication.outputs.eligible == 'true'
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./publish
          external_repository: yuhaiin/yuhaiin.github.io
          publish_branch: main # default: gh-pages
          enable_jekyll: false

      - name: upload_static
        uses: actions/upload-artifact@v7
        with:
          name: statics
          path: |
            dist
            frontend.tar.gz
            frontend-update.json
