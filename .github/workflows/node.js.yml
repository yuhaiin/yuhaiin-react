# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm install --force

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm run test

      - name: Translations
        run: npm run i18n:check

      - name: Style audit
        run: npm run style:audit

      - name: Lint
        run: npm run lint

      - run: npm run build
        env:
          CI: false

      - name: Capture updated desktop and mobile UX snapshots
        run: |
          set -euo pipefail
          npm run dev:msw > /tmp/msw-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5175/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-ux.mjs || { cat /tmp/msw-preview.log; exit 1; }
          for screenshot in /tmp/ux-shots/*.png; do
            name=$(basename "$screenshot" .png)
            echo "UX_SCREENSHOT_BEGIN:$name"
            base64 -w 8192 "$screenshot"
            echo "UX_SCREENSHOT_END:$name"
          done

      - run: |
          cat <<EOF > dist/go.mod
          module github.com/yuhaiin/yuhaiin.github.io

          go 1.22.0
          EOF
          
      - run: |
          cat <<EOF > dist/yuhaiin.go
          package yuhaiin_github_io

          import "embed"

          //go:embed index.html assets docs
          var Content embed.FS
          EOF

      - run: |
          git clone https://github.com/yuhaiin/yuhaiin.github.io.git publish
          rm -rf publish/.git
          rm -rf publish/_next
          rm -rf publish/_not-found
          rm -rf publish/404
          rm -rf publish/404.html
          rm -rf publish/index.txt
          rm -rf publish/__next.__PAGE__.txt
          rm -rf publish/__next._full.txt
          rm -rf publish/__next._index.txt
          rm -rf publish/__next._tree.txt
          rm -rf publish/assets
          rm -rf publish/docs
          rm -rf publish/index.html
          cp -rf dist/* publish/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request'
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./publish
          external_repository: yuhaiin/yuhaiin.github.io
          publish_branch: main # default: gh-pages
          enable_jekyll: false

      - name: upload_static
        uses: actions/upload-artifact@v7
        with:
          name: statics
          path: |
            dist
