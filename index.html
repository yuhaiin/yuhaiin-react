<!doctype html>
<html lang="en">

<head>
  <meta charSet="utf-8" />
  <title>Yuhaiin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/docs/faviconv2.ico" />
  <!-- <meta name="theme-color" content="#000000" /> -->
  <meta name="description" content="yuhaiin" />
  <link rel="apple-touch-icon" href="/docs/logov2192.png" />
  <script>
    (function () {
      // Set defaults even when storage access is blocked.
      var theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var accent = 'olive';
      try {
        var pref = localStorage.getItem('yuhaiin.theme');
        theme = (pref === 'light' || pref === 'dark')
          ? pref
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var savedAccent = localStorage.getItem('yuhaiin.accent');
        if (['olive', 'terracotta', 'plum', 'brass', 'graphite'].indexOf(savedAccent) !== -1) accent = savedAccent;
      } catch (e) {}
      document.documentElement.setAttribute('data-bs-theme', theme);
      document.documentElement.setAttribute('data-accent', accent);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
